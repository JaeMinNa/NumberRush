systemLog:
  destination: file
  path: "D:/Git/Github/NumberRush/DB/log.txt"
  logAppend: true
storage:
  dbPath:
    "D:/Git/Github/NumberRush/DB/dbPath"
  wiredTiger:
    engineConfig:
      cacheSizeGB: 2
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true
net:
  bindIp: 0.0.0.0 
  port: 27018
security:
  authorization: disabled
setParameter:
  enableLocalhostAuthBypass: false